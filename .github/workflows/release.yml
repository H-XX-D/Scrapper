name: Publish playable HTML
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (for example v7)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-playable
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate requested draft
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+$ ]]
          test -f "exports/Scrapper-Playable-$RELEASE_TAG.sha256"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - run: npm ci
      - run: npm run check
      - run: npm run export
      - name: Check reproducible export
        working-directory: exports
        run: sha256sum --check "Scrapper-Playable-$RELEASE_TAG.sha256"
      - run: npm test
      - name: Upload and publish verified HTML
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "exports/Scrapper-Playable-$RELEASE_TAG.html" "exports/Scrapper-Playable-$RELEASE_TAG.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
